<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Table</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e0a800'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23fff3b0' stroke-width='4' stroke-dasharray='7 6'/%3E%3Ccircle cx='32' cy='32' r='19' fill='%23a87800'/%3E%3Cpath d='M32 15C26 23 18 27 18 34a7 7 0 0012 4c-.5 4-1.5 6-3.5 9h11c-2-3-3-5-3.5-9a7 7 0 0012-4C46 27 38 23 32 15z' fill='%23111'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e0a800'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23fff3b0' stroke-width='4' stroke-dasharray='7 6'/%3E%3Ccircle cx='32' cy='32' r='19' fill='%23a87800'/%3E%3Cpath d='M32 15C26 23 18 27 18 34a7 7 0 0012 4c-.5 4-1.5 6-3.5 9h11c-2-3-3-5-3.5-9a7 7 0 0012-4C46 27 38 23 32 15z' fill='%23111'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg,#0d1013);color:var(--ink,#eef2f6);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
:root{--cw:clamp(46px,min(6.4vw,10.5vh),150px);--pw:clamp(60px,min(8vw,15vh),200px);--ow:clamp(40px,min(4.6vw,8vh),104px);--tw:clamp(36px,min(4.4vw,7.4vh),96px);--cd:clamp(26px,min(2.6vw,4.6vh),48px);--mw:clamp(46px,min(6vw,10vh),90px)}
@media(max-width:999px){:root{--cw:clamp(44px,14vw,110px);--pw:clamp(62px,21vw,150px);--ow:clamp(40px,12vw,76px);--tw:clamp(34px,11.5vw,70px);--cd:clamp(24px,6vw,36px);--mw:clamp(54px,18vw,90px)}}
#app{max-width:1920px;margin:0 auto;padding:8px 10px 20px}
.ic{width:1em;height:1em;display:inline-block;vertical-align:middle;flex:none}
/* header */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.hb{position:relative;width:52px;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.12);box-shadow:0 3px 8px rgba(0,0,0,.3);background:var(--panel,#1b2025);display:flex;align-items:center;justify-content:center;font-size:30px;padding:0}
.hb.off{opacity:.6}
.hb.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:4px;background:#ff4b4b;transform:rotate(-40deg);border-radius:2px}
.hb .sp{font-size:30px;line-height:1}
@media(hover:hover){.hb:hover,.btn:not(:disabled):hover,.pick:hover{filter:brightness(1.15)}}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.stat{display:flex;align-items:center;gap:6px;background:var(--panel,#1b2025);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:4px 10px;min-height:44px;font-weight:800;font-size:20px}
.stat .ic{font-size:24px}
/* layout */
.table,.mk{display:grid;grid-template-columns:200px minmax(0,1fr) 350px;gap:12px;align-items:start}
.mk{grid-template-columns:200px minmax(0,1fr)}
@media(max-width:999px){.table,.mk{grid-template-columns:minmax(0,1fr)}.table .felt{order:1}.table .side{order:2}.table .ladder{order:3}.mk .ladder{order:3}}
.ladder{background:var(--panel,#1b2025);border:1px solid rgba(255,255,255,.1);box-shadow:0 6px 16px rgba(0,0,0,.3);border-radius:20px;padding:8px;display:flex;flex-direction:column;gap:4px}
@media(max-width:999px){.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
.lrow{display:flex;align-items:center;gap:6px;padding:3px 5px;border-radius:10px;border:2px solid transparent;position:relative}
.lrow .lab{font-size:9px;text-transform:uppercase;letter-spacing:.2px;opacity:.7;width:54px;line-height:1.05;flex:none}
.lrow .cards{display:flex;gap:2px}
.lrow.on{background:rgba(255,200,40,.2);border-color:#ffc828;box-shadow:0 0 12px rgba(255,200,40,.5)}
.lrow.bestrow::after{content:"";position:absolute;right:4px;top:50%;width:16px;height:16px;margin-top:-8px;background:#ffd23c;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.mc{--mcw:22px;width:var(--mcw);height:calc(var(--mcw)*1.35);background:#fff;color:#111;border-radius:4px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(var(--mcw)*.5);line-height:1;font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.mc i{font-style:normal;display:block;width:calc(var(--mcw)*.5);height:calc(var(--mcw)*.5)}
.mc.red{color:#d22}
.pic{display:flex;gap:2px;align-items:center}
.pic .mc{--mcw:24px}
/* felt */
.felt{--rw:clamp(12px,1.7vw,24px);--R:clamp(48px,16vw,220px);position:relative;isolation:isolate;border-radius:var(--R);padding:calc(var(--rw) + clamp(10px,2.2vh,24px)) calc(var(--rw) + clamp(6px,2.4vw,44px));display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:calc(100vh - 128px);box-shadow:0 16px 36px rgba(0,0,0,.55)}
.felt::before,.felt::after{content:"";position:absolute;z-index:0;pointer-events:none}
.felt::before{inset:0;border-radius:var(--R);background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 9px),linear-gradient(165deg,var(--rail1),var(--rail2) 55%,var(--rail3));box-shadow:inset 0 2px 3px rgba(255,255,255,.25),inset 0 -3px 6px rgba(0,0,0,.45)}
.felt::after{inset:var(--rw);border-radius:calc(var(--R) - var(--rw));background:radial-gradient(ellipse at 50% 42%,rgba(255,255,255,.17),transparent 62%),radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,.42) 100%),repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),var(--tbl,none) center/cover,radial-gradient(ellipse at 50% 40%,var(--fa),var(--fb) 88%);box-shadow:inset 0 0 0 3px var(--trim),inset 0 10px 22px rgba(0,0,0,.5)}
.felt>*{position:relative;z-index:1}
.felt>.bline{position:absolute;z-index:0;inset:calc(var(--rw) + 7%) calc(var(--rw) + 5%);border:2px solid rgba(255,255,255,.16);border-radius:calc(var(--R)*.8);pointer-events:none}
.half{display:flex;flex-direction:column;align-items:center;gap:6px}
.center{display:flex;flex-direction:column;align-items:center;gap:8px}
.zone{display:flex;align-items:center;justify-content:center;gap:8px 16px;flex-wrap:wrap}
.betrow{min-height:calc(var(--cd)*1.5);display:flex;align-items:center;justify-content:center}
.plate{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:6px 14px 6px 6px;box-shadow:0 5px 12px rgba(0,0,0,.4)}
.plate .avatar{width:clamp(44px,5vw,66px);height:clamp(44px,5vw,66px)}
.pinfo{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.plate .nm{font-size:14px;opacity:.9;line-height:1}
.plate .pilebox{--cd:clamp(20px,2vw,28px);min-height:calc(var(--cd)*1.7);align-items:flex-end}
.plate .num{font-size:clamp(18px,1.8vw,26px)}
.who{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.avatar{width:clamp(56px,7vw,96px);height:clamp(56px,7vw,96px);border-radius:50%;background:rgba(0,0,0,.35);border:3px solid var(--edge,#888);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.avatar svg,.avatar img{width:100%;height:100%;display:block}
.avatar.wob{animation:wob 2.4s ease-in-out infinite}
.nm{font-weight:900;font-size:16px;letter-spacing:.5px}
.dbtn{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#e4e4e4);color:#222;border:2px solid #cfcfcf;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 3px 5px rgba(0,0,0,.55),inset 0 0 0 2px #fff,inset 0 0 0 3px #bbb}
.bubble{min-width:96px;min-height:46px;padding:6px 14px;border-radius:18px;background:#fff;color:#111;font-weight:900;font-size:20px;display:flex;align-items:center;gap:6px;justify-content:center;position:relative;animation:pop .3s;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.bubble.empty{visibility:hidden}
.bubble .ic{font-size:26px}
.bubble.fold{color:#c01818}.bubble.call,.bubble.check{color:#1458c8}.bubble.raise,.bubble.allin{color:#138a3a}
.dots3 span{display:inline-block;width:10px;height:10px;border-radius:50%;background:#555;margin:0 2px;animation:blink 1s infinite}
.dots3 span:nth-child(2){animation-delay:.2s}.dots3 span:nth-child(3){animation-delay:.4s}
.hand{display:flex;gap:8px}
.mid{display:flex;align-items:center;justify-content:center;gap:12px 24px;flex-wrap:wrap}
.board{display:flex;gap:min(10px,1.2vw);justify-content:center}
.slot{width:var(--cw);height:calc(var(--cw)*1.4);border:2px dashed rgba(255,255,255,.2);border-radius:calc(var(--cw)*.08);background:rgba(0,0,0,.16)}
.stk{display:flex;align-items:center;gap:6px}
.tray{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:18px;background:rgba(255,210,60,.14);border:2px solid rgba(255,210,60,.65);box-shadow:0 0 18px rgba(255,210,60,.35),inset 0 0 12px rgba(0,0,0,.25);visibility:hidden;z-index:4!important;max-width:100%}
.tray.on{visibility:visible}
.tray .tcrown{font-size:clamp(22px,2.6vw,34px);color:#ffd23c;flex:none}
.tray .avatar{width:clamp(34px,3.6vw,48px);height:clamp(34px,3.6vw,48px);flex:none;animation:none}
.trow{display:flex;gap:min(8px,1.2vw)}
.tc{--w:var(--tw);position:relative;z-index:6;will-change:transform}
.card.ghost{background:rgba(255,255,255,.3);box-shadow:none;animation:none;filter:none}
.card.ghost>*{opacity:.35}
.card.ghost::after{content:"";position:absolute;inset:0;border:2px dashed rgba(255,255,255,.95);border-radius:inherit}
.card.dim{opacity:.6}
/* cards */
.card{--w:var(--cw);width:var(--w);height:calc(var(--w)*1.4);font-size:var(--w);background:linear-gradient(160deg,#fff,#f3f1ea);border-radius:.09em;position:relative;color:#16181c;box-shadow:0 .03em .05em rgba(0,0,0,.5),0 .09em .16em rgba(0,0,0,.32),inset 0 0 0 .012em rgba(0,0,0,.18);flex:none;user-select:none;border:0}
.card.red{color:#cf1f2a}
.su{width:1em;height:1em;display:block}
.card .cn{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1;gap:.015em}
.card .cn b{font-size:.3em;font-weight:800;letter-spacing:-.02em}
.card .cn .su{width:.23em;height:.23em}
.card .tl{left:.07em;top:.05em}
.card .br{right:.07em;bottom:.05em;transform:rotate(180deg)}
.card .big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.card .big .su{width:.54em;height:.54em}
.card.bc{--w:var(--cw)}.card.pc{--w:var(--pw)}.card.oc{--w:var(--ow)}.card.kc{--w:var(--mw)}
.card.back{background:#fff;overflow:hidden;padding:0}
.card.back svg,.card.back img{width:100%;height:100%;display:block}
.card.glow{box-shadow:0 0 .08em .03em #ffe14d,0 0 .2em .06em var(--glow,#ffd23c);animation:glo 1.2s ease-in-out infinite;z-index:2}
.card.soft{box-shadow:0 0 .06em .02em rgba(255,225,77,.9),0 0 .14em .03em rgba(255,210,60,.6),0 .09em .16em rgba(0,0,0,.32)}
.card.deal{animation:dealin .35s ease-out}
@keyframes dealin{from{transform:translateY(-30px) scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes glo{50%{filter:brightness(1.12)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-24px) scale(1.15);opacity:0}to{transform:none;opacity:1}}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes blink{50%{opacity:.25}}
@keyframes puls{50%{transform:scale(1.03);box-shadow:0 0 0 5px rgba(255,255,255,.35)}}
@keyframes bounce{50%{transform:translateY(-8px)}}
/* chips */
.pilebox{display:flex;align-items:center;gap:8px;min-height:calc(var(--cd)*1.5)}
.pilebox.pop .pile{animation:drop .45s ease-out}
.pile{display:inline-flex;align-items:flex-end;padding-left:calc(var(--cd)*.2)}
.col{display:flex;flex-direction:column-reverse;margin-left:calc(var(--cd)*-.2)}
.chip{--c:#d62828;--e:#fff;--t:#fff;width:var(--cd);height:calc(var(--cd)*.64);border-radius:50%;position:relative;
 background:radial-gradient(ellipse closest-side at 50% 50%,var(--c) 0 56%,var(--e) 58% 63%,transparent 65%),repeating-conic-gradient(var(--e) 0 16deg,var(--c) 16deg 45deg);
 box-shadow:0 .08em 0 rgba(0,0,0,.5),0 .14em .12em rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:var(--cd)}
.chip+.chip{margin-bottom:calc(var(--cd)*-.45)}
.chip b{font-size:.25em;color:var(--t);font-weight:900;text-shadow:0 0 2px rgba(0,0,0,.6);line-height:1}
.num{font-weight:900;font-size:clamp(20px,2.2vw,32px);background:rgba(0,0,0,.45);border-radius:12px;padding:0 10px;min-width:40px;text-align:center;color:#fff;text-shadow:0 1px 2px #000}
.num.me{background:rgba(255,255,255,.14)}
/* side */
.side{background:var(--panel,#1b2025);border:1px solid rgba(255,255,255,.1);box-shadow:0 6px 16px rgba(0,0,0,.3);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:300px}
.coach{display:flex;flex-direction:column;gap:6px}
.drow{display:flex;align-items:center;gap:8px}
.drow .ic{font-size:26px;flex:none}
.dots{display:flex;gap:4px;flex:1}
.dots i{flex:1;aspect-ratio:1;max-width:26px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.2)}
.dots i.g{background:#2fd35f;border-color:#bfffd0;box-shadow:0 0 6px #2fd35f}
.dots i.o{background:#ff9a1f;border-color:#ffe0b0;box-shadow:0 0 6px #ff9a1f}
.frac{font-weight:900;font-size:22px;min-width:64px;text-align:right}
.pay{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.pay .pilebox{--cd:26px}
.pay .num{font-size:20px}
.verdict{display:flex;align-items:center;justify-content:center;gap:12px;border-radius:16px;padding:6px 12px;font-weight:900;font-size:34px;letter-spacing:1px;color:#fff;min-height:64px}
.verdict .ic{font-size:44px}
.verdict.bet{background:#1c9a46}.verdict.check,.verdict.call{background:#1f6fe0}.verdict.fold{background:#d62828}
.coach .avatar{width:34px;height:34px;border-width:2px;flex:none}
.coach .mc{--mcw:22px}
.dots i.r{background:#ff3b3b;border-color:#ffc0c0;box-shadow:0 0 6px #ff3b3b}
.dots i.y{background:#ffd23c;border-color:#fff1b0;box-shadow:0 0 6px #ffd23c}
.coach .dots i{max-width:22px;border-width:2px}
.coach .frac{font-size:18px;min-width:44px}
.pairpic{display:flex;gap:2px;flex:none}
.drawbox{border:2px solid rgba(255,210,60,.4);border-radius:12px;padding:4px 6px;display:flex;flex-direction:column;gap:4px;background:rgba(255,210,60,.06)}
.grp{display:flex;align-items:center;gap:2px;font-weight:900;font-size:18px;flex:none;margin-right:4px}
.grp .mc{--mcw:28px;flex:none;height:calc(var(--mcw)*1.7);gap:2px}
.grp .su{width:24px;height:24px}.grp .su.red{color:#e23}
.grps{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.drawbox .ar{font-size:24px;color:#ffd23c;display:inline-flex}
.drawbox .pic{margin-left:auto}
.mc.bk{background:#a8192b;border:2px solid #fff;color:#a8192b}
.vrow{display:flex;gap:8px;align-items:stretch}
.vrow .verdict{flex:1;cursor:pointer}
.rep{width:64px;height:64px;border-radius:50%;border:0;background:#e0a800;color:#2a1c00;font-size:38px;display:flex;align-items:center;justify-content:center;flex:none;padding:0;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.nums{font-size:12px;font-weight:700;opacity:.8;text-align:center;margin-top:4px;letter-spacing:.02em;line-height:1.3}
.why{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:20px;background:rgba(255,255,255,.14);border-radius:999px;padding:2px 14px;min-height:34px}
.slot.hint{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--cw)*.7);color:rgba(255,255,255,.3);border-style:solid;border-color:rgba(255,210,60,.35)}
#app{position:relative}
.vpanel{position:absolute;z-index:50;top:68px;left:10px;width:min(420px,calc(100vw - 20px));background:var(--panel,#1b2025);border:2px solid rgba(255,255,255,.25);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.vr{display:flex;gap:6px}
.vr button{border:1px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.08);min-height:48px;font-weight:800;font-size:18px;padding:0 10px}
.vr .vs{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left}
.vr .vs.sel{background:#1c9a46}
.vr .vp{width:56px;font-size:26px;background:#1f6fe0;display:flex;align-items:center;justify-content:center}
.wait{display:flex;align-items:center;justify-content:center;min-height:120px}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.greens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;grid-column:1/-1}
.greens:empty{display:none}
.btn{min-width:0;border:0;border-radius:16px;min-height:64px;padding:6px 10px;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:22px;letter-spacing:.5px;box-shadow:0 5px 0 rgba(0,0,0,.4);position:relative}
.btn .ic{font-size:30px}
.btn:disabled{filter:grayscale(1) brightness(.65);opacity:.55;cursor:default;box-shadow:none}
.btn.fold{background:#d62828}.btn.call{background:#1f6fe0}.btn.bet{background:#1c9a46;flex-direction:column;gap:2px;padding:6px 4px;font-size:17px;min-height:84px}
.btn.bet .pilebox{--cd:22px;min-height:44px}
.btn.bet .num{font-size:17px;min-height:0;padding:0 6px}
.btn.big{min-height:76px;font-size:30px;width:100%;background:#1c9a46}
.btn.gold{background:#e0a800;color:#2a1c00}
.btn.pulse{animation:puls 1s ease-in-out infinite}
.btn.call .pilebox{--cd:22px;min-height:36px}
.btn.call .num{font-size:18px;min-width:0;padding:0 6px;background:rgba(0,0,0,.3)}.btn.call .pilebox{gap:4px}.btn.call{gap:5px;font-size:20px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{border:3px solid transparent;background:rgba(0,0,0,.25);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px}
.pick.sel{border-color:#ffd23c;background:rgba(255,210,60,.22);box-shadow:0 0 14px rgba(255,210,60,.6)}
.pick .avatar{width:clamp(56px,5.5vw,84px);height:clamp(56px,5.5vw,84px)}
.pick .stars{display:flex;gap:2px;color:#ffd23c;font-size:20px}
.pick .stars .off{color:rgba(255,255,255,.2)}
.banner{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.banner .crown{font-size:48px;color:#ffd23c;animation:bounce 1s ease-in-out infinite;display:flex;gap:10px;align-items:center}
.banner .gain{font-weight:900;font-size:48px;line-height:1}
.banner .gain.win{color:#4cf07e}.banner .gain.lose{color:#ff7b7b}
.rhs{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.rh{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:16px;background:rgba(0,0,0,.25);max-width:100%}
.rh .avatar{width:46px;height:46px;border-width:2px;flex:none;animation:none}
.rh.win{background:rgba(255,210,60,.16);box-shadow:0 0 0 2px rgba(255,210,60,.6)}
.rb{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.rcards{display:flex;gap:3px}
.rcards .mc{--mcw:min(30px,calc((100vw - 150px)/5))}
.szpile{display:flex;align-items:flex-end;flex:none}.szpile .col{margin-left:0}.szpile .chip{--cd:24px;width:24px;height:15px}
.verdict .sz{display:flex;align-items:flex-end;min-height:48px}
@media(max-width:520px){.tray{flex-wrap:wrap;justify-content:center;gap:2px 8px;padding:4px 6px}.trow{flex-basis:100%;justify-content:center;gap:2px}.tc{--w:min(var(--tw),calc((100vw - 80px)/5))}}
.rl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;opacity:.85}
.sym{font-size:30px;font-weight:900;line-height:1}
.rh .fi{font-size:34px;color:#ff6b6b;display:flex}
/* skins: same table, different materials */
body[data-skin=classic]{--fa:#2f9b5c;--fb:#135b35;--rail1:#b0753a;--rail2:#74451f;--rail3:#4a2a12;--trim:rgba(0,0,0,.4)}
body[data-skin=tavern]{--fa:#2f7a4a;--fb:#143a26;--rail1:#8a5a2c;--rail2:#5a3518;--rail3:#33200f;--trim:rgba(0,0,0,.45)}
body[data-skin=war]{--fa:#4a6690;--fb:#202f4b;--rail1:#8a95a1;--rail2:#4a525b;--rail3:#2b3036;--trim:#d79a1e}
/* make a hand */
.mkfelt{align-items:center;min-height:0;gap:14px}
.dicebar{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.die{width:64px;height:64px;border-radius:14px;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.die i{width:12px;height:12px;border-radius:50%;margin:auto}
.die i.p{background:#111}
.die.rolling{animation:shake .25s linear infinite}
@keyframes shake{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.mgrid{display:grid;grid-template-columns:repeat(6,auto);gap:10px;justify-content:center}
@media(max-width:700px){.mgrid{grid-template-columns:repeat(4,auto);gap:8px}}
.cb{border:0;background:none;padding:0;border-radius:.1em;position:relative;display:block}
.cb .card{display:block}
.cb.chosen .card{opacity:.18}
.cb.chosen{outline:3px dashed rgba(255,255,255,.5);outline-offset:-2px}
.cb.flip .card{animation:dealin .4s}
.five{display:flex;gap:min(8px,1.5vw);justify-content:center;padding:8px;background:rgba(0,0,0,.28);border-radius:16px}
.five .slot,.five .card{--w:min(calc(var(--mw)*.85),15vw);width:var(--w);height:calc(var(--w)*1.4)}
.five .slot{--cw:var(--w)}
.five .cb .card{opacity:1;animation:dealin .25s}
.stars{display:flex;gap:6px;font-size:48px;color:#ffd23c;justify-content:center}
.stars .off{color:rgba(255,255,255,.2)}
.res{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:20px}
.mkbtns{display:flex;gap:12px;justify-content:center;width:100%;max-width:420px}
.mkbtns .btn{width:100%}
.five.best{background:rgba(255,210,60,.12)}
.btn.bet .pilebox{flex-wrap:wrap;justify-content:center;gap:4px}
@media(max-width:520px){.btn{font-size:18px;gap:5px}.btn .ic{font-size:24px}.btn.bet{font-size:14px}.btn.bet .pilebox,.btn.call .pilebox{--cd:16px;min-height:28px}.btn.bet .num,.btn.call .num{font-size:15px}.stat{font-size:16px;padding:2px 8px}.verdict{font-size:28px}.banner .gain{font-size:40px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* many-player table */
.felt.mt{--cw:clamp(38px,min(4.6vw,8.4vh),100px);--pw:clamp(54px,min(6vw,11.4vh),130px);--ow:clamp(28px,min(3.1vw,5.4vh),64px);--tw:clamp(34px,min(3.9vw,6.8vh),80px);--cd:clamp(15px,min(1.6vw,3vh),28px);--av:clamp(38px,min(4vw,7vh),76px);display:block;padding:0;height:calc(100vh - 100px);min-height:540px}
.felt.mt>.seat{position:absolute;z-index:3;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.felt.mt>.seat.me{left:50%;top:auto;bottom:1.6%;transform:translateX(-50%);flex-direction:row;align-items:flex-end;gap:14px;z-index:4}
.seat .hand{gap:3px;min-height:calc(var(--ow)*1.4)}
.seat.me .hand{gap:8px;min-height:0}
.seat .avatar{width:var(--av);height:var(--av);border-width:2px}
.splate{position:relative;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:4px 10px 4px 4px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.seat.me .splate{flex-direction:column;padding:6px 10px;gap:2px}
.seat .pinfo{align-items:flex-start;gap:1px}
.seat.me .pinfo{align-items:center}
.seat .nm{font-size:clamp(11px,1.15vw,17px);line-height:1.05;white-space:nowrap}
.mstk{display:flex;align-items:center;gap:4px}
.mstk .pile{padding-left:calc(var(--cd)*.2)}
.mstk .num,.sbet .num,.cpot .num{font-size:clamp(13px,1.35vw,22px);padding:0 6px;min-width:0;min-height:0}
.seat.fold .splate{opacity:.5;filter:grayscale(.7)}
.seat.turn .splate{box-shadow:0 0 0 3px #ffd23c,0 0 16px rgba(255,210,60,.75)}
.sbub{position:absolute;left:50%;top:2px;transform:translateX(-50%);z-index:6;pointer-events:none}
.seat.me .sbub{top:auto;bottom:100%;margin-bottom:6px}
.bubble.sm{min-width:0;min-height:0;padding:3px 10px;font-size:clamp(13px,1.3vw,19px);border-radius:14px;white-space:nowrap;gap:4px}
.bubble.sm .ic{font-size:1.25em}
.allb{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:#e0301e;color:#fff;font-weight:900;font-size:clamp(10px,1vw,14px);border-radius:10px;padding:1px 8px;white-space:nowrap;display:flex;gap:3px;align-items:center;z-index:4;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.allb .ic{font-size:1.2em}
.lvb{position:absolute;left:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;background:#ffd23c;color:#222;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #222}
.flash{position:absolute;left:50%;top:-4px;font-weight:900;color:#4cf07e;font-size:clamp(15px,1.5vw,22px);text-shadow:0 1px 3px #000;animation:fl 2.4s ease-out forwards;z-index:7;pointer-events:none}
@keyframes fl{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-16px)}}
.felt.mt>.sbet,.felt.mt>.cboard,.felt.mt>.cpot{position:absolute;transform:translate(-50%,-50%);z-index:2}
.felt.mt>.cboard{left:50%;top:44%}
.felt.mt>.cpot{left:50%;top:59%}
.sbet .pilebox,.cpot .pilebox{min-height:0;gap:4px}
.felt.mt>.tray{--tw:clamp(32px,min(3.5vw,6vh),72px);position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);z-index:7}
.felt.mt .board{gap:min(8px,1vw)}
.rh.sm{padding:3px 8px;background:rgba(0,0,0,.18);box-shadow:none}
.rh.sm .avatar{width:32px;height:32px}
.rh.sm .mc{--mcw:19px!important}
.rh.sm .rl{font-size:10px}
.rhs .rh .avatar{animation:none}
.modes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mode{border:3px solid transparent;background:rgba(0,0,0,.25);border-radius:14px;padding:4px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:76px;justify-content:center}
.mode svg{width:100%;max-width:62px;height:auto}
.mode b{font-size:22px;font-weight:900;line-height:1}
.mode:last-child b{font-size:17px}
.mode.sel{border-color:#ffd23c;background:rgba(255,210,60,.22);box-shadow:0 0 14px rgba(255,210,60,.6)}
@media(max-width:999px){
 .felt.mt{--cw:clamp(40px,15.2vw,70px);--pw:clamp(56px,19vw,110px);--ow:clamp(22px,6.6vw,44px);--tw:clamp(30px,8.6vw,60px);--cd:clamp(13px,3.8vw,22px);--av:clamp(32px,9.5vw,48px);height:clamp(500px,148vw,760px);min-height:0}
 .seat:not(.me) .nm{display:none}
 .splate{padding:3px 6px 3px 3px;gap:3px;flex-direction:column;border-radius:14px}
 .seat .pinfo{align-items:center}
 .mstk .num,.sbet .num,.cpot .num{font-size:13px;padding:0 4px}
 .mstk .col{display:none}
 .bubble.sm{font-size:12px;padding:2px 7px}
 .allb{font-size:9px;padding:0 5px}
 .felt.mt>.seat.me{gap:8px;bottom:3%}
 .felt.mt>.tray{top:68%}
 .felt.mt>.cboard{top:51%}

 .felt.mt .board{gap:4px}
 .felt.mt .tray .tav,.felt.mt .tray .tcrown{display:none}
 .felt.mt .tray{padding:4px 6px}
}

.botsel{display:flex;gap:6px}.botsel button{flex:1;min-height:52px;border:3px solid transparent;border-radius:12px;background:rgba(0,0,0,.3);color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;gap:3px}.botsel button .ic{font-size:26px}.botsel .sel{border-color:#ffd23c;background:rgba(255,210,60,.22)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{min-height:62px;font-size:34px;font-weight:900;border-radius:14px;background:#2d3640;color:#fff;border:2px solid rgba(255,255,255,.2);box-shadow:0 4px 0 rgba(0,0,0,.4)}.pad .bk{background:#b23a3a}.pad .ok{background:#1c9a46}.pad button:disabled{opacity:.35}.pad .ic{font-size:34px}
.digs{display:flex;gap:6px;justify-content:center}.digs b{width:clamp(44px,12vw,62px);height:clamp(56px,15vw,74px);border-radius:12px;background:rgba(0,0,0,.4);border:3px solid rgba(255,255,255,.3);font-size:40px;display:flex;align-items:center;justify-content:center;color:#ffd23c}
.bigpic{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;font-size:28px;font-weight:900;text-align:center}.bigpic .ic{font-size:84px}.bigpic.nc{color:#ff9a8a}
.obk{min-height:50px;width:100%}
.hgl{display:flex;justify-content:center;font-size:64px;color:#ffd23c;animation:puls 1.6s ease-in-out infinite}
.pendn{display:flex;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:22px;color:#ffd23c}
.away{position:absolute;right:-6px;top:-6px;background:#c33;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:4}
.seat .who{position:relative}
.cover{position:absolute;inset:0;background:rgba(0,0,0,.62);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:900;font-size:34px;z-index:30;border-radius:inherit}.cover .ic{font-size:84px;color:#ffd23c}
.seat:not(.me) .nm.hn{display:block}

function seatIcon(nb){var dots='',pts=[],i;
 if(nb===1)pts=[[50,14]];else pts=(window.innerWidth<700?POSN:POS)[nb];
 pts.forEach(function(p,k){var l=nb===1?1:LVS[nb][k],col=['#7bd84f','#7fd0ff','#ff6a5a'][l-1];dots+='<circle cx="'+(p[0]*.9+5)+'" cy="'+(p[1]*.62+4)+'" r="6.5" fill="'+col+'" stroke="#0008" stroke-width="1.5"/>'});
 return '<svg viewBox="0 0 100 70" aria-hidden="true"><ellipse cx="50" cy="35" rx="46" ry="30" fill="#1f7a45" stroke="#8a5a2c" stroke-width="5"/>'+dots+'<circle cx="50" cy="62" r="7" fill="#ffd23c" stroke="#0008" stroke-width="1.5"/></svg>'}
function chooserHTML(){var b=function(m,lab,sub){return '<button class="mode'+(ui.mode===m?' sel':'')+'" data-mode="'+m+'" aria-label="'+sub+'">'+seatIcon(m==='h'?1:m)+'<b>'+lab+'</b></button>'};
 return '<div class="modes">'+b(2,'2','table, 2 computer players')+b(3,'3','table, 3 computer players')+b(4,'4','table, 4 computer players')+b(5,'5','table, 5 computer players')+b('h','1 v 1','one against one')+'</div>'}

/* ---------- chrome ---------- */
function headHTML(){var s=ui.stats,t=ui.screen==='table';
 var hb=function(t,ic,off,lab){return '<button class="hb'+(off?' off':'')+'" data-t="'+t+'" aria-label="'+lab+'">'+ic+'</button>'};
 var h='<header class="top">'+hb('home',I('home'),false,'home')+hb('screen',t?I('dice'):'<span class="sp" style="width:30px;height:30px;display:block">'+su(3)+'</span>',false,'screen')+hb('coach',I('bulb'),!ui.coach,'coach')+hb('sound',I('spk'),!ui.sound,'sound')+hb('voice',I('voice'),false,'voice')+hb('skin',I('brush'),false,'skin')+'<div class="stats">';
 var st=function(ic,v){return '<div class="stat">'+ic+'<span>'+v+'</span></div>'};
 if(t)h+=st(I('cards'),s.hands)+st(I('coin','style="color:#2fd35f"'),s.won)+st(I('coin','style="color:#e0a800"'),s.biggest)+'<div class="stat">'+(s.best>=0?ladPic(s.best):'–')+'</div>'+st(I('flame','style="color:#ff8a1f"'),s.streak)+st(I('trophy','style="color:#ffd23c"'),s.trophies);
 else h+=st(I('star','style="color:#ffd23c"'),s.stars)+st(I('flame','style="color:#ff8a1f"'),s.starStreak)+st(I('cards'),s.rounds);
 return h+'</div></header>'}
function vpanelHTML(){var cv=curVoice();return '<div class="vpanel">'+VOICES.slice(0,8).map(function(v,i){return '<div class="vr"><button class="vs'+(cv===v?' sel':'')+'" data-vs="'+i+'">'+v.name.replace(/^(Google|Microsoft) /,'')+'</button><button class="vp" data-vp="'+i+'" aria-label="play">'+I('play')+'</button></div>'}).join('')+'</div>'}
function render(){applySkin();document.getElementById('app').innerHTML=headHTML()+(ui.vpanel?vpanelHTML():'')+(ui.screen==='table'?tableHTML():makeHTML());if(ui.phase==='end'&&ui.sd&&ui.sd.done&&ui.screen==='table')layoutSD(false)}
document.addEventListener('click',function(e){var el=e.target.closest&&e.target.closest('[data-on],[data-a],[data-go],[data-t],[data-mode],[data-lv],[data-i],[data-rep],[data-vs],[data-vp]');if(!el||el.disabled)return;
 var d=el.dataset;
 if(d.on!==undefined){onlClick(d.on);return}
 if(d.t){if(d.t==='home'){goHome();return}if(d.t==='screen'){ui.screen=ui.screen==='table'?'make':'table';if(ui.screen==='make'&&!ui.mh)mkNew()}else if(d.t==='voice')ui.vpanel=!ui.vpanel;else if(d.t==='coach')ui.coach=!ui.coach;else if(d.t==='sound'){ui.sound=!ui.sound;if(!ui.sound){try{window.speechSynthesis.cancel()}catch(x){}}}else if(d.t==='skin')ui.skin=SKIN_ORDER[(SKIN_ORDER.indexOf(ui.skin)+1)%SKIN_ORDER.length];save();render();return}
 if(d.rep!==undefined){if(ui.lastSay)speak(ui.lastSay);return}
 if(d.vs!==undefined||d.vp!==undefined){var vv=VOICES[+(d.vs!==undefined?d.vs:d.vp)];if(!vv)return;if(d.vs!==undefined){ui.voiceName=vv.name;try{localStorage.setItem('pk_voice',vv.name)}catch(x){}render()}speakWith('Hello. I am your poker coach.',vv);return}
 if(d.mode){ui.mode=d.mode==='h'?'h':+d.mode;render();return}
 if(d.lv){ui.level=+d.lv;save();render();return}
 if(d.a){var ac=d.a==='raise'?{type:'raise',to:+d.to}:{type:d.a};if(ui.multi){if(ui.ctl)ui.ctl.act(ac)}else playerAct(ac);return}
 if(d.i!==undefined){mkTap(+d.i);return}
 if(d.go==='deal'&&ui.mode!=='h')startTable();
 else if(d.go==='tnext'){if(ui.ctl)ui.ctl.next()}
 else if(d.go==='deal'||d.go==='next')deal();
 else if(d.go==='new'||d.go==='again'){newMatch();render()}
 else if(d.go==='roll')mkRoll();
 else if(d.go==='tick')mkCheck()});
load();newMatch();mkNew();applySkin();
Object.defineProperty(window,'__game',{get:function(){return {m:ui.m,ui:ui,ctl:ui.ctl,lastSay:ui.lastSay}}});
window.__test={deal:function(a,b,c){ui.mode='h';clearTimeout(ui.timer);deal({h0:a,h1:b,b:c})}};
window.__mh={bestIdx:function(){return ui.mh&&ui.mh.up?mkBest().idx:null}};
(function(){var r=lsGet('pk_room');if(!r)return;try{r=JSON.parse(r)}catch(e){return}if(r&&/^\d{5}$/.test(r.room)&&Date.now()-r.at<6*3600000)joinRoom(r.room);else lsSet('pk_room',null)})();
render();
})();
</script>
