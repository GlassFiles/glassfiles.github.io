<style>
/* VOICE: warm, homely, a little magical. IDEA: a street of real front doors at dusk, one per day.
   PICTURE: the doors themselves, each a different house front. COLOUR: dusk amber in autumn, snowy night blue at Christmas.
   TYPE: Georgia throughout. LAYOUT: title, month switch, the street of doors, notes below. */
:root{--ink:#f3e9d8;--ink2:#cbbfa9;--gold:#e3b55a;--skyA:#1d1424;--skyB:#4a2a22;--board:#2b1f19;--glow:255,178,92}
body.xmas{--ink:#eef3f8;--ink2:#b9c6d4;--gold:#f0c560;--skyA:#0b1220;--skyB:#1c2a40;--board:#1b2230;--glow:255,196,120}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100dvh;color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden;
  background:radial-gradient(ellipse 60% 40% at 8% 0%,rgba(var(--glow),.22),transparent 70%),radial-gradient(ellipse 60% 40% at 92% 0%,rgba(var(--glow),.18),transparent 70%),linear-gradient(180deg,var(--skyA),var(--skyB));
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
canvas.fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
#fxBack{z-index:0}#fxFront{z-index:5}
header{position:relative;z-index:2;text-align:center;padding:18px 12px 6px}
h1{font-weight:normal;font-size:clamp(24px,4.8vw,40px);margin:4px 0 2px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.sub{color:var(--ink2);font-size:15px;margin:0 0 10px}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:6px 0 4px}
.controls button,.controls select{min-height:44px;min-width:44px;padding:0 14px;font:16px Georgia,serif;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.25);border-radius:22px;touch-action:manipulation;cursor:pointer}
.controls button[aria-pressed="true"]{background:rgba(var(--glow),.28);border-color:var(--gold)}
.controls #goToday{background:rgba(var(--glow),.42);border-color:var(--gold);color:#fff}
.controls label{font-size:15px;color:var(--ink2)}
.lights{position:relative;z-index:2;width:100%;height:34px;margin:4px auto 0;max-width:1180px;display:none}
body.xmas .lights{display:block}
.board{position:relative;z-index:2;max-width:1180px;margin:6px auto 20px;padding:46px 14px 40px;border-radius:10px;background:var(--board);box-shadow:inset 0 0 90px rgba(0,0,0,.7),0 10px 40px rgba(0,0,0,.5)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:50px 10px}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:54px 12px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:56px 12px}}
.bay{position:relative;aspect-ratio:120/216;border:0;padding:0;margin:0;background:none;cursor:pointer;touch-action:manipulation;color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}
.bay>*{pointer-events:none}
.bay:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:6px}
.bay svg{display:block;width:100%;height:100%;overflow:visible}
.layer{position:absolute;inset:0}
.hole{position:absolute;left:8.333%;top:10.185%;width:83.334%;height:78.704%;perspective:1100px}
.inside{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 80% 70% at 50% 35%,rgba(var(--glow),.95),rgba(150,80,30,.85) 55%,#2a140a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;opacity:0;transition:opacity .4s}
.bay.ajar .inside,.bay.open .inside,.bay.saloon .inside{opacity:1}
.inside .frame{width:62%;aspect-ratio:4/3;background:#f4ead6;border:3px solid #6b4423;box-shadow:0 2px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.inside .frame svg{width:60%;height:60%}
.inside .play{font-size:clamp(10px,1.5vw,14px);color:#3a1d0b;background:#f6d38b;border-radius:10px;padding:2px 8px}
.leaf{position:absolute;inset:0;transform-origin:0% 50%;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.25,.7,.25,1);will-change:transform}
.leaf>svg,.leaf .back{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .back{transform:rotateY(180deg)}
.bay.ajar .leaf{transform:rotateY(-20deg)}
.bay.open .leaf{transform:rotateY(-108deg)}
/* saloon: two half-height bat-wing doors */
.leaf.wing{top:30%;bottom:auto;height:42%;width:50%}
.leaf.wing.R{left:50%;transform-origin:100% 50%}
.bay.saloon .leaf.L{animation:swingL 4s ease-in-out infinite}
.bay.saloon .leaf.R{animation:swingR 4s ease-in-out infinite}
@keyframes swingL{0%,100%{transform:rotateY(-6deg)}50%{transform:rotateY(4deg)}}
@keyframes swingR{0%,100%{transform:rotateY(6deg)}50%{transform:rotateY(-4deg)}}
.bay.saloon.open .leaf.L{transform:rotateY(-72deg);animation:swingOpenL 2s ease-out forwards}
.bay.saloon.open .leaf.R{transform:rotateY(72deg);animation:swingOpenR 2s ease-out forwards}
@keyframes swingOpenL{0%{transform:rotateY(0)}35%{transform:rotateY(-118deg)}60%{transform:rotateY(-48deg)}80%{transform:rotateY(-84deg)}100%{transform:rotateY(-72deg)}}
@keyframes swingOpenR{0%{transform:rotateY(0)}35%{transform:rotateY(118deg)}60%{transform:rotateY(48deg)}80%{transform:rotateY(84deg)}100%{transform:rotateY(72deg)}}
.leaf.dbl{width:50%;bottom:auto}
.leaf.dbl.R{left:50%;transform-origin:100% 50%}
.bay.ajar .leaf.dbl.L{transform:rotateY(-16deg)}
.bay.ajar .leaf.dbl.R{transform:rotateY(16deg)}
.bay.open .leaf.dbl.L{transform:rotateY(-104deg)}
.bay.open .leaf.dbl.R{transform:rotateY(104deg)}
.bay.shake .leaf{animation:rattle .55s ease-in-out}
@keyframes rattle{0%,100%{translate:0 0}15%{translate:-2px 0}30%{translate:2px 0}45%{translate:-2px 0}60%{translate:1.5px 0}80%{translate:-1px 0}}
.bay.locked .leaf,.bay.locked .wall{filter:brightness(.8) saturate(.85)}
.cap{position:absolute;left:-4px;right:-4px;bottom:-20px;text-align:center;font-size:13px;line-height:1.1;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today .cap{color:var(--gold)}
.handle,.knocker,.wreath,.balloons,.flame,.lamp,.tail,.burst,.twinkle{transform-box:fill-box}
.handle{transform-origin:50% 50%;transition:transform .35s ease}
.lever{transform-origin:100% 50%}
.bay.turn .handle{transform:rotate(-55deg)}

.bay.jiggle .handle{animation:jig .5s ease-in-out}
.bay.jiggle .lever{animation:jigL .5s ease-in-out}
@keyframes jig{0%,100%{transform:rotate(0)}25%{transform:rotate(-22deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-14deg)}}
@keyframes jigL{0%,100%{transform:rotate(0)}25%{transform:rotate(-20deg)}50%{transform:rotate(-4deg)}75%{transform:rotate(-14deg)}}
.knocker{transform-origin:50% 0%}
.bay.knock .knocker{animation:knock .7s ease-in-out}
@keyframes knock{0%,100%{transform:scaleY(1)}20%{transform:scaleY(.45)}35%{transform:scaleY(1)}55%{transform:scaleY(.45)}70%{transform:scaleY(1)}}
.today .knocker{animation:idleKnock 6s ease-in-out infinite}
/* today's door wears a warm halo (Guy, 16 Nov) */
.bay.today{z-index:2}
.bay.today::after{content:"";position:absolute;inset:2% 1% 3%;border-radius:10px;pointer-events:none;box-shadow:0 0 14px 5px rgba(255,196,96,.75),0 0 34px 12px rgba(255,170,60,.35);animation:halo 2.6s ease-in-out infinite}
.bay.today.flash::after{animation:haloFlash .45s ease-in-out 3}
@keyframes halo{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes haloFlash{0%,100%{opacity:.6}50%{opacity:1;box-shadow:0 0 22px 10px rgba(255,214,120,.95),0 0 50px 20px rgba(255,170,60,.5)}}
@keyframes idleKnock{0%,88%,100%{transform:scaleY(1)}92%{transform:scaleY(.8)}96%{transform:scaleY(1)}}
.wreath{transform-origin:50% 0%;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.balloons{transform-origin:50% 100%;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.flame{transform-origin:50% 100%;animation:flick .9s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1);opacity:.95}100%{transform:scale(.85,1.15);opacity:.75}}
.lamp{animation:lampf 3s ease-in-out infinite alternate}
@keyframes lampf{0%{opacity:.8}100%{opacity:1}}
.tail{transform-origin:0% 100%;animation:tail 2.6s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
.burst{transform-origin:50% 50%;animation:burst 2.4s ease-out infinite}
@keyframes burst{0%{transform:scale(.1);opacity:0}10%{opacity:1}70%{transform:scale(1);opacity:.9}100%{transform:scale(1.1);opacity:0}}
.twinkle{animation:tw 1.8s ease-in-out infinite alternate}
.critter{transform-box:fill-box;transform-origin:50% 100%}
.bay.open .critter.cat{animation:catLeap 1.5s ease-in-out .1s forwards}
@keyframes catLeap{0%{transform:translate(0,0)}20%{transform:translate(0,1.2px) scale(1.06,.82)}28%{transform:translate(calc(var(--dx)*.1),-6px) rotate(-14deg)}52%{transform:translate(calc(var(--dx)*.5),-26px) rotate(-6deg)}74%{transform:translate(calc(var(--dx)*.85),-15px) rotate(12deg) scale(.85);opacity:1}100%{transform:translate(var(--dx),-10px) scale(.45);opacity:0}}
.bay.open .critter.run{animation:bound 1.5s linear .05s forwards}
.bay.disturb .critter.bird,.bay.startle .critter.bird{animation:flyoff 1.6s ease-in forwards}
.leg{transform-box:fill-box;transform-origin:50% 0%}
.bay.open .critter.run .la{animation:legA .16s ease-in-out infinite alternate}
.bay.open .critter.run .lb{animation:legB .16s ease-in-out infinite alternate}
@keyframes legA{0%{transform:rotate(35deg)}100%{transform:rotate(-35deg)}}
@keyframes legB{0%{transform:rotate(-35deg)}100%{transform:rotate(35deg)}}
.peck{transform-box:fill-box;transform-origin:20% 100%;animation:peck 2.6s ease-in-out infinite}
@keyframes peck{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(16deg)}86%{transform:rotate(0)}92%{transform:rotate(14deg)}}
.wing{transform-box:fill-box;transform-origin:20% 60%}
.bay.disturb .critter.bird .peck,.bay.startle .critter.bird .peck{animation:none}
.bay.disturb .critter.bird .wing,.bay.startle .critter.bird .wing{animation:flap .09s linear infinite alternate}
@keyframes flap{0%{transform:rotate(-70deg) scaleY(1.6)}100%{transform:rotate(30deg) scaleY(1.2)}}
@keyframes flyoff{0%{transform:translate(0,0)}8%{transform:translate(0,-3px) scaleX(-1)}22%{transform:translate(calc(var(--dx)*.12),-16px) scaleX(-1) rotate(var(--rot))}50%{transform:translate(calc(var(--dx)*.45),-48px) scaleX(-1) rotate(var(--rot))}75%{transform:translate(calc(var(--dx)*.75),-80px) scaleX(-1) rotate(calc(var(--rot)*.5)) scale(.8);opacity:1}100%{transform:translate(var(--dx),-120px) scaleX(-1) scale(.55);opacity:0}}
/* poses that swap when the animal moves */
.critter .leap,.critter .fly{opacity:0}
.bay.open .critter.cat .sit{animation:off .01s linear .42s forwards}
.bay.open .critter.cat .leap{animation:on .01s linear .42s forwards}
.bay.disturb .critter.bird .ground,.bay.startle .critter.bird .ground{animation:off .01s linear .14s forwards}
.bay.disturb .critter.bird .fly,.bay.startle .critter.bird .fly{animation:on .01s linear .14s forwards}
@keyframes off{to{opacity:0}}@keyframes on{to{opacity:1}}
.wingF{transform-box:fill-box;transform-origin:50% 100%}.wingF.wB{transform-origin:50% 0%}
.bay.disturb .critter.bird .wingF,.bay.startle .critter.bird .wingF{animation:flapF .1s linear infinite alternate}
.bay.disturb .critter.bird .wingF.wB,.bay.startle .critter.bird .wingF.wB{animation:flapB .1s linear infinite alternate}
@keyframes flapF{0%{transform:scaleY(1)}100%{transform:scaleY(-.5)}}
@keyframes flapB{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}
.bay.open .critter.cat .leap .la{animation:legA .22s ease-in-out .42s 3 alternate}
.bw{transform-box:fill-box}.bwL{transform-origin:100% 60%}.bwR{transform-origin:0% 60%}
.bfly .bw{animation:rest 3.4s ease-in-out infinite}
@keyframes rest{0%,80%,100%{transform:scaleX(1)}88%{transform:scaleX(.25)}}
.bay.disturb .critter.flutter .bw,.bay.startle .critter.flutter .bw{animation:bflap .07s linear infinite alternate}
@keyframes bflap{0%{transform:scaleX(1)}100%{transform:scaleX(.15)}}
.bay.disturb .critter.flutter,.bay.startle .critter.flutter{animation:flutterOff 2.2s ease-in-out forwards}
/* a startled neighbour's bird or butterfly comes back a few seconds later, so it is still there to fly when its own door opens */
.bay.homing .critter.bird,.bay.homing .critter.flutter{animation:homeBack 1.3s ease-out both}
.bay.homing .critter.bird .wing,.bay.homing .critter.flutter .bw{animation:flap .09s linear 12 alternate}
.bay.homing .critter.bird .ground{animation:hideThenShow 1.1s steps(1,end) both}
.bay.homing .critter.bird .fly{animation:showThenHide 1.1s steps(1,end) both}
@keyframes hideThenShow{0%{opacity:0}100%{opacity:1}}
@keyframes showThenHide{0%{opacity:1}100%{opacity:0}}
@keyframes homeBack{0%{transform:translate(calc(var(--dx)*-.5),-70px) scaleX(-1);opacity:0}25%{opacity:1}80%{transform:translate(0,-4px) scaleX(-1)}100%{transform:translate(0,0)}}
@keyframes flutterOff{0%{transform:translate(0,0)}15%{transform:translate(calc(var(--dx)*.1),-10px) rotate(-12deg)}30%{transform:translate(calc(var(--dx)*-.05),-22px) rotate(10deg)}45%{transform:translate(calc(var(--dx)*.3),-34px) rotate(-14deg)}60%{transform:translate(calc(var(--dx)*.2),-52px) rotate(12deg)}80%{transform:translate(calc(var(--dx)*.6),-70px) rotate(-8deg);opacity:1}100%{transform:translate(var(--dx),-96px) scale(.7);opacity:0}}
@keyframes catIn_old{0%{transform:translate(0,0)}12%{transform:translate(0,-2px) scaleY(1.08)}30%{transform:translate(calc(var(--dx)*.3),-9px)}42%{transform:translate(calc(var(--dx)*.45),-3px)}62%{transform:translate(calc(var(--dx)*.75),-8px) scale(.9)}80%{transform:translate(calc(var(--dx)*.92),-10px) scale(.75);opacity:1}100%{transform:translate(var(--dx),-12px) scale(.5);opacity:0}}
@keyframes bound{0%{transform:translate(0,0)}8%{transform:translate(0,-2px) scaleX(-1)}20%{transform:translate(calc(var(--dx)*.14),-9px) scaleX(-1)}32%{transform:translate(calc(var(--dx)*.28),0) scaleX(-1)}46%{transform:translate(calc(var(--dx)*.45),-9px) scaleX(-1)}58%{transform:translate(calc(var(--dx)*.6),0) scaleX(-1)}72%{transform:translate(calc(var(--dx)*.78),-8px) scaleX(-1);opacity:1}86%{transform:translate(calc(var(--dx)*.92),0) scaleX(-1)}100%{transform:translate(var(--dx),-4px) scaleX(-1);opacity:0}}
.mist{animation:mist 9s ease-in-out infinite alternate}
@keyframes mist{0%{transform:translateX(-8px)}100%{transform:translateX(8px)}}
.today .glowring{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.75}}
.bulb{animation:tw 2.2s ease-in-out infinite alternate}
.topple{transform-box:fill-box}.tL{transform-origin:0% 100%}.tR{transform-origin:100% 100%}
.bay.open .tL{animation:toppleL 1s cubic-bezier(.5,0,.8,.6) .25s forwards}
.bay.open .tR{animation:toppleR 1s cubic-bezier(.5,0,.8,.6) .25s forwards}
@keyframes toppleL{0%{transform:rotate(0)}70%{transform:rotate(-86deg)}82%{transform:rotate(-77deg)}100%{transform:rotate(-83deg)}}
@keyframes toppleR{0%{transform:rotate(0)}70%{transform:rotate(86deg)}82%{transform:rotate(77deg)}100%{transform:rotate(83deg)}}

@keyframes tw{0%{opacity:.35}100%{opacity:1}}
.legend{position:relative;z-index:2;max-width:1180px;margin:30px auto 30px;padding:0 16px;color:var(--ink2);font-size:15px;line-height:1.55}
.legend b{color:var(--ink);font-weight:normal}

<script>

{

const CFG=window.ADVENT||{};
const ALLOW=CFG.allow||{};

const MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS={};
(CFG.months||[{year:2026,month:12,skin:"xmas"}]).forEach(m=>{
  const days=new Date(m.year,m.month,0).getDate(), first=new Date(m.year,m.month-1,1).getDay();
  const ev={},special={};
  for(const [date,list] of Object.entries(CFG.events||{})){const [y,mo,d]=date.split("-").map(Number);if(y===m.year&&mo===m.month)ev[d]=list}
  for(const [date,kind] of Object.entries(CFG.specialDoors||{})){const [y,mo,d]=date.split("-").map(Number);if(y===m.year&&mo===m.month&&kind&&allow("doorStyles",kind))special[d]=kind}
  MONTHS[m.month]={name:MONTH_NAMES[m.month-1],year:m.year,days,first,skin:m.skin||(m.month===12?"xmas":"autumn"),ev,special};
});
const MKEYS=Object.keys(MONTHS).map(Number);
const CAPTIONS=CFG.captions||{};
const HOMES=Object.fromEntries(Object.entries(CFG.homes||{}).map(([d,h])=>[d,h.caption]));
const MATS=Object.fromEntries(Object.entries(CFG.homes||{}).map(([d,h])=>[d,h.mat||""]));
const VERSES=CAPTIONS;
const NO_BALLOONS=["poppy"];
const FIREWORKS=allow("effects","fireworks")?["bonfire","nye"]:[];
let month=MKEYS[0], today=1, soundOn=allow("effects","sound");
{const now=new Date();const k=now.getMonth()+1;if(MONTHS[k]&&MONTHS[k].year===now.getFullYear()){month=k;today=now.getDate()}
 else{const m0=MONTHS[MKEYS[0]],start=new Date(m0.year,MKEYS[0]-1,1);if(now<start){month=MKEYS[0];today=0}else{month=MKEYS[MKEYS.length-1];today=MONTHS[month].days+1}}}
const dateOf=d=>`${M().year}-${String(month).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const RM=matchMedia("(prefers-reduced-motion: reduce)");
const M=()=>MONTHS[month], skin=()=>M().skin, X=()=>skin()==="xmas";
const isSunday=d=>((M().first+d-1)%7)===0;

/* ================= seeded variety ================= */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const COLOURS=["#1f4d3a","#1f3254","#6e1f2b","#1c1c1f","#86aaa4","#b8892b","#4d2a47","#a3262a","#7b8d70","#8a5a2b*","#6b4423*","#4a535a","#d6ccb0","#8a7da4","#1f5f63","#4f3320*","#7d98b3","#2e4a2a","#a2522f","#33363b","#c08a3e","#3b2236","#596b3a","#8d1e22","#2f5d7c","#9a3b2a","#5e6b4f","#c9b48a","#3d3f6b","#6d7f86","#7a2e4a","#405a43"];
const STYLES=["four","six","fan","glazed","cottage","stable","arch","pair"].filter(k=>allow("doorStyles",k));if(!STYLES.length)STYLES.push("four");
const HANDLES=["knob","lever","ring","knob","lever","knob","lever"];
const METALS=[{c:"#c9a24a",h:"#f3dc8f"},{c:"#26262a",h:"#6a6a72"},{c:"#aeb3b8",h:"#eef1f4"},{c:"#b06a3b",h:"#e6a777"}];
const NUMS=["brass","slate","tile","numerals","iron","wood","brass","numerals"];
const WALLS=[{k:"brick",c:"#8b4a37"},{k:"stock",c:"#b59a6a"},{k:"render",c:"#e9e4d8"},{k:"render",c:"#e7c3bd"},{k:"render",c:"#cfe0d0"},{k:"render",c:"#efe0a8"},{k:"render",c:"#c7d7e4"},{k:"stone",c:"#c3b8a4"},{k:"brick",c:"#6f3a2c"},{k:"stock",c:"#9e8c6a"}];
const SURR=[{c:"#d9d2c3",k:"plain"},{c:"#ecebe6",k:"pediment"},{c:"#f2efe8",k:"keystone"},{c:"#bdb5a3",k:"keystone"},{c:"#efe8d8",k:"plain"},{c:"#8f877a",k:"plain"},{c:"#ffffff",k:"pediment"}];
function look(day){
  const mo=M(), r=rng(month*1000+day*7919+3);
  const colI=shuffled(COLOURS.map((_,i)=>i),month*17)[day-1];
  const cs=COLOURS[colI], wood=cs.endsWith("*"), col=cs.replace("*","");
  let style=STYLES[shuffled(Array.from({length:35},(_,i)=>i%STYLES.length),month*29)[day-1]];
  const special=mo.special[day]||null;
  if(isSunday(day)&&allow("doorStyles","church")){const fs=[1,2,3,4,5,6,7].find(isSunday);style=["church1","church2","church3"][Math.floor((day-fs)/7)%3]}
  if(special==="saloon") style="saloon";
  if(special==="downing") style="downing";
  const CH={church1:"#5e2f17",church2:"#b07a34",church3:"#2a3033"};
  const L={day,col: style==="downing"?"#141416":(CH[style]||col), wood: style==="church1"||style==="church2"?true:wood, style,
    handle: style==="cottage"?"latch":(style.startsWith("church")?"none":(style==="downing"?"knob":HANDLES[Math.floor(r()*HANDLES.length)])),

    knocker: ["cottage","saloon"].includes(style)||style.startsWith("church")?null:(style==="downing"?"lion":(r()<.5?(r()<.5?"ring":"stirrup"):null)),
    letterbox: r()<.55?(r()<.3?"vertical":"plate"):null,
    num: NUMS[Math.floor(r()*NUMS.length)],
    catflap: ["four","six","stable","arch"].includes(style)&&r()<.25,
    kick: !["cottage","saloon"].includes(style)&&!style.startsWith("church")&&r()<.3,
    wall: style==="downing"?{k:"brick",c:"#2b2724"}:WALLS[Math.floor(r()*WALLS.length)],
    surr: SURR[Math.floor(r()*SURR.length)],
    lantern: style!=="downing"&&r()<.35, bell: r()<.45?(r()<.75?"push":"pull"):null,
    swag: r()<.4, icicles: r()<.35, creeper: r()<.3,
    r1:r(), r2:r(), r3:r(), r4:r(), r5:r(), r6:r()};
  if(month===12){const dbl=style.startsWith("church")||style==="pair";
    const W0={arch:3,swagbows:3,snowystar:3,nutcracker:2,lanterns:3,simple:4,tinsel:3,ribbonwreath:3,icicle:4,holly:3};
    const W=Object.fromEntries(Object.entries(W0).filter(([k])=>allow("christmasLooks",k)));if(!Object.keys(W).length)W.simple=1;
    const SEQ=shuffled(Object.entries(W).flatMap(([k,n])=>Array(n).fill(k)),777);
    L.xt= style==="downing"?"downing":(["church2","church3"].includes(style)?"churchplain":(style==="church1"?"simple":SEQ[(day-1)%SEQ.length]));
    const FL={snowystar:[2,"lit"],swagbows:[2,"topiary"],lanterns:[2,"planter"],simple:[1,"tree"],tinsel:[1,"tree"],downing:[1,"tree"],churchplain:[1,"tree"]}[L.xt]||[0,""];
    L.xflank=FL[0]; L.xtree=FL[1];
    if(!["downing","church1","saloon"].includes(style)) L.lantern=true; L.swag=false; L.lantern2= L.xt==="nutcracker";}
  {const n=parseInt(L.col.slice(1),16),lum=(0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255; L.dark=lum<.45; if(L.num==="iron"&&L.dark) L.num="numerals";}

  if(style.startsWith("church")){L.letterbox=null;L.knocker=null;L.catflap=false;L.kick=false;L.bell=null;L.lantern=false;L.handle="none";
    L.num="brass";
    if(style==="church1"){L.wall={k:"stock",c:"#d9cfbd"};L.surr={c:"#e6dccb",k:"plain"}}
    if(style==="church2"){L.wall={k:"granite",c:"#8f9093"};L.surr={c:"#a9a9ab",k:"plain"}}
    if(style==="church3"){L.wall={k:"ashlar",c:"#cbbf9f"};L.surr={c:"#c2b48f",k:"plain"}}}

  if(style==="pair"){L.letterbox=null;L.knocker=null;L.catflap=false;L.kick=false;L.handle="none";L.num=r()<.5?"brass":"slate"}

}

let GID=0;

/* ================= build ================= */
const grid=document.getElementById("grid");
function evOf(d){return M().ev[d]||[]}
function stateOf(d){return d<today?"past":(d===today?"today":"locked")}
function build(){
  GID=0; grid.innerHTML="";
  const days=M().days, order=shuffled(Array.from({length:days},(_,i)=>i+1),month*101+5);
  order.forEach(day=>{
    const L=look(day), st=stateOf(day), ev=evOf(day);
    L.hy={cottage:92,stable:110}[L.style]||96;
    const b=document.createElement("button");
    b.className="bay "+(st==="past"?"ajar":st==="locked"?"locked":"today")+(L.style==="saloon"?" saloon":"");
    b.dataset.day=day;
    const sun=isSunday(day)?", Sunday":"";
    b.setAttribute("aria-label",`Door ${day}, ${day} ${M().name}${sun}`+(ev.length?`, ${ev.map(e=>e.t).join(", ")}`:"")+(st==="locked"?", locked":st==="today"?", today, tap to open":", opened"));
    const inside = L.style==="saloon" ? saloonInside(L) : `<div class="frame"><svg viewBox="0 0 56 44" aria-hidden="true"><rect x="2" y="2" width="52" height="40" rx="4" fill="none" stroke="#9c8a70" stroke-width="3"/><circle cx="18" cy="15" r="5" fill="#c9b38f"/><path d="M6 38 L22 22 L32 31 L40 24 L52 38 Z" fill="#c9b38f"/></svg></div>${st==="today"?'<span class="play">Play</span>':''}`;
    const leaves = isDbl(L.style)
      ? (()=>{const t=DBL_TOP[L.style]/170*100;return ["L","R"].map(sd=>`<div class="leaf dbl ${sd}" style="top:${t.toFixed(3)}%;height:${(100-t).toFixed(3)}%">${dblSVG(L,sd,st!=="locked")}<div class="back" style="background:${sh(L.col,-.4)}"></div></div>`).join("")})()
      : L.style==="downing" ? (()=>{const t=LEAF_TOP.downing/170*100;return `<div class="leaf" style="top:${t.toFixed(3)}%;height:${(100-t).toFixed(3)}%">${downingLeaf(L)}<div class="back" style="background:#0b0b0c"></div></div>`})()
      : L.style==="saloon"
      ? `<div class="leaf wing L">${wingSVG(L,"L")}<div class="back" style="background:${sh(L.col,-.4)}"></div></div><div class="leaf wing R">${wingSVG(L,"R")}<div class="back" style="background:${sh(L.col,-.4)}"></div></div>`
      : `<div class="leaf">${leafSVG(L,st)}<div class="back" style="background:linear-gradient(90deg,${sh(L.col,-.45)},${sh(L.col,-.25)})"></div></div>`;
    const cap = ev.length ? ev.map(e=>e.t.replace(/ \(example\)/,"*")).join(" · ") : HOMES[day] ? HOMES[day] : (VERSES[day] ? VERSES[day] : (isSunday(day)?"Sunday":(L.style==="downing"?"Number 10":(st==="today"?"Today":""))));
    b.innerHTML = surroundSVG(L,st)+`<div class="hole"><div class="inside">${inside}</div>${leaves}</div>`+frontSVG(L)+`<span class="cap">${cap}</span>`;
    b.addEventListener("click",()=>tap(b,day));
    grid.appendChild(b);
  });
  legend();
}
function legend(){
  const ev=M().ev, lines=Object.keys(ev).map(d=>`<b>${d} ${M().name}</b>: ${ev[d].map(x=>x.t).join(" and ")}`).join("<br>");
  document.getElementById("legend").innerHTML=(lines?`On the doors this ${M().name}:<br>${lines}<br><br>`:"")+(CFG.note||"");
}

  for(let i=0;i<14;i++){const tt=t+.15+Math.random()*.7,c=a.createBufferSource(),cg=a.createGain(),hf=a.createBiquadFilter();c.buffer=noiseBuf(a,.02);hf.type="highpass";hf.frequency.value=3000;cg.gain.setValueAtTime(.08+Math.random()*.08,tt);cg.gain.exponentialRampToValueAtTime(.0001,tt+.02);c.connect(hf).connect(cg).connect(a.destination);c.start(tt);c.stop(tt+.03)}}

/* ================= tapping a door ================= */
const toastEl=document.getElementById("toast");let toastT;
function toast(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove("on"),2400)}
let busy=false;
function tap(b,day){
  ac();const st=stateOf(day);b.classList.add("disturb");startle(b);
  if(st==="locked"){b.classList.remove("jiggle");void b.offsetWidth;b.classList.add("jiggle");clickSound();setTimeout(clickSound,180);const n=CFG.demoControls?day-today:Math.round((new Date(M().year,month-1,day)-new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))/864e5);toast(n===1?`Door ${day} is locked. It opens tomorrow.`:`Door ${day} is locked. It opens in ${n} days.`);return}
  if(b.classList.contains("open")){showCard(day);return}
  if(busy)return;busy=true;
  const rm=RM.matches,hasKnocker=!!b.querySelector(".knocker"),pet=!!b.querySelector(".critter")||b.classList.contains("saloon"),fw=evOf(day).some(e=>FIREWORKS.includes(e.k));
  const T=rm?{turn:0,shake:0,shed:0,open:0,card:250}:{turn:hasKnocker?750:0,shake:hasKnocker?1050:300,shed:hasKnocker?1150:400,open:hasKnocker?1650:900,card:(hasKnocker?2900:2150)+(pet?1300:0)+(fw||evOf(day).some(e=>e.k==="eve")?3400:0)};
  if(!rm){if(hasKnocker){b.classList.add("knock");knockSound(.12);knockSound(.42)}else{knockSound(0);knockSound(.28)}}
  setTimeout(()=>{b.classList.remove("knock");b.classList.add("turn");clickSound()},T.turn);
  setTimeout(()=>{if(!rm)b.classList.add("shake")},T.shake);
  setTimeout(()=>{if(!rm)shed(b)},T.shed);
  setTimeout(()=>{b.classList.remove("shake","ajar");b.classList.add("open");creakSound();if(fw&&!rm)FX.fireworks(b.getBoundingClientRect());if(!rm&&allow("effects","sleigh")&&evOf(day).some(e=>e.k==="eve"))sleigh()},T.open);

  el.innerHTML=`<svg viewBox="0 0 260 60" width="260" height="60">${deer(150)}${deer(122)}${deer(94)}${deer(66)}<path d="M66 24 L36 34" stroke="#1b1d26" stroke-width=".8"/><path d="M4 26 h30 q6 0 6 6 v4 h-34 z" fill="#1b1d26"/><path d="M0 44 h44 q6 0 6 -4" stroke="#1b1d26" stroke-width="2" fill="none"/><circle cx="18" cy="20" r="5" fill="#1b1d26"/><path d="M14 18 l4 -8 l4 8z" fill="#1b1d26"/><circle cx="174" cy="12" r="1.6" fill="#ff4d4d"/></svg>`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),7000);
}
function shed(b){const r=b.getBoundingClientRect(),x=X();for(let i=0;i<(x?34:16);i++){const p=FX.spawn(x?"snow":"leaf",true);p.x=r.left+r.width*(.06+Math.random()*.88);p.y=r.top+r.height*(.03+Math.random()*.05);p.vy=(x?20:15)+Math.random()*30;p.vx=(Math.random()-.5)*40;p.size*=x?.9:.7;p.life=0;p.ttl=1.6+Math.random()*1.2;p.floorY=r.top+r.height*.92}}
const dlg=document.getElementById("dlg");
/* only the next-door neighbours on the SAME row are startled (never the row above or below); their birds come back */
function startle(b){
  if(!allow("effects","startleNeighbours"))return;
  const top=b.offsetTop;
  [b.previousElementSibling,b.nextElementSibling].forEach(n=>{
    if(!n||!n.classList.contains("bay")||n.offsetTop!==top||n.classList.contains("startle"))return;
    if(!n.querySelector(".critter.bird,.critter.flutter"))return;
    n.classList.remove("homing");n.classList.add("startle");
    setTimeout(()=>{n.classList.remove("startle");void n.offsetWidth;n.classList.add("homing");setTimeout(()=>n.classList.remove("homing"),1400)},4200);
  });
}
/* locked photos: the key comes from the family code in the link (#g=...), never from the page */
const photoCache={};
async function unlockPhoto(path){
  if(photoCache[path])return photoCache[path];
  const m=/[#&]g=([A-Za-z0-9-]{6,20})/.exec(location.hash);if(!m||!window.crypto||!crypto.subtle)return null;
  try{const norm=m[1].toLowerCase().replace(/[^a-z0-9]/g,""),enc=new TextEncoder();
    const key=await crypto.subtle.importKey("raw",await crypto.subtle.digest("SHA-256",enc.encode("key|"+norm)),"AES-GCM",false,["decrypt"]);
    const buf=new Uint8Array(await (await fetch(path)).arrayBuffer());
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},key,buf.slice(12));
    return photoCache[path]=URL.createObjectURL(new Blob([pt],{type:"image/jpeg"}));
  }catch(e){return null}
}
function behindOf(day){const b=Object.assign({},CFG.behind||{},(CFG.behindDays||{})[dateOf(day)]||{});return b}

  document.getElementById("dE").innerHTML=ev.map(e=>`<span class="ev">${e.t}</span>`).join("")+(isSunday(day)&&!ev.length&&allow("doorStyles","church")?`<span class="ev">Sunday</span>`:"")+(CAPTIONS[day]?`<span class="ev">${CAPTIONS[day]}</span>`:"")+(HOMES[day]?`<span class="ev">${HOMES[day]}</span>`:"");
  const photo=(CFG.photos||{})[date], ph=document.getElementById("dPh");
  if(photo&&photo.enc){ph.innerHTML=`<span style="opacity:.7">Opening the photo…</span>`;unlockPhoto(photo.enc).then(u=>{if(u)ph.innerHTML=`<img src="${u}" alt="" style="width:100%;height:100%;object-fit:contain">`;else ph.innerHTML=`<span>The photo opens with the family link</span>`})}
  else ph.innerHTML= photo ? `<img src="${photo}" alt="" style="width:100%;height:100%;object-fit:contain">` : `<svg width="56" height="44" viewBox="0 0 56 44" aria-hidden="true"><rect x="2" y="2" width="52" height="40" rx="4" fill="none" stroke="#9c8a70" stroke-width="3"/><circle cx="18" cy="15" r="5" fill="#c9b38f"/><path d="M6 38 L22 22 L32 31 L40 24 L52 38 Z" fill="#c9b38f"/></svg><span>${b.photoPlaceholder||"A family photo goes here"}</span>`;
  document.getElementById("dMsg").textContent=(b.message||"").replace("{day}",day);

/* ================= falling leaves, acorns and snow ================= */
const FX=(()=>{
  const back=document.getElementById("fxBack"),front=document.getElementById("fxFront"),cb=back.getContext("2d"),cf=front.getContext("2d");
  let W=0,H=0,parts=[],shedParts=[],last=0,running=true,wind=0,gust=0,rockets=[],sparks=[];
  const FWC=["#ffd34d","#ff6b5b","#7ad0ff","#9dff7a","#ff8af0","#ffffff","#ffb347","#c9a0ff"];
  function fireworks(r){
    for(let i=0;i<10;i++) setTimeout(()=>{
      const top=Math.max(30,Math.min(r.top-40,H*.45)), ty= top>80 ? 40+Math.random()*(top-40) : 30+Math.random()*90;
      rockets.push({x:r.left+r.width*(.15+Math.random()*.7),y:r.top+r.height*.12,vx:(Math.random()-.5)*90,vy:-(420+Math.random()*200),ty,col:FWC[Math.floor(Math.random()*FWC.length)],kind:Math.random()<.3?"ring":(Math.random()<.5?"willow":"peony")});
      whoosh();
    },i*360+Math.random()*120);
  }
  function burst(rk){
    const n=rk.kind==="ring"?48:80, two=Math.random()<.35?FWC[Math.floor(Math.random()*FWC.length)]:rk.col;
    for(let i=0;i<n;i++){const a=rk.kind==="ring"?i/n*6.283:Math.random()*6.283, sp=rk.kind==="ring"?150:(40+Math.random()*170);
      sparks.push({x:rk.x,y:rk.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,ttl:rk.kind==="willow"?2.4:1.3+Math.random()*.6,col:i%2?rk.col:two,g:rk.kind==="willow"?40:70,px:rk.x,py:rk.y,tw:Math.random()<.3})}
    bang();
  }
  const LEAFCOL=["#a4161a","#ba181b","#d1361b","#8d1e1e","#e06c1f","#e8892b","#e8a33d","#d9a520","#b5892a","#9c4a1a","#7a4520","#6e3b1b","#c25a1b","#b23a16","#c79a2b"];
  const maple=new Path2D("M0 1 L.07 .52 L.55 .68 L.45 .44 L.96 .1 L.7 .02 L.82 -.36 L.46 -.25 L.42 -.52 L.2 -.3 L0 -1 L-.2 -.3 L-.42 -.52 L-.46 -.25 L-.82 -.36 L-.7 .02 L-.96 .1 L-.45 .44 L-.55 .68 L-.07 .52 Z");
  function lobed(lobes,w,depth){const p=new Path2D();for(let i=0;i<=120;i++){const t=i/120*Math.PI*2,r=(1-depth)+depth*Math.abs(Math.sin(lobes*t/2)),x=w*r*Math.sin(t),y=-r*Math.cos(t);i?p.lineTo(x,y):p.moveTo(x,y)}p.closePath();return p}
  const oak=lobed(7,.5,.22),birch=(()=>{const p=new Path2D();p.moveTo(0,-1);p.quadraticCurveTo(.62,-.2,0,1);p.quadraticCurveTo(-.62,-.2,0,-1);p.closePath();return p})(),beech=(()=>{const p=new Path2D();p.moveTo(0,-1);p.bezierCurveTo(.55,-.6,.5,.5,0,1);p.bezierCurveTo(-.5,.5,-.55,-.6,0,-1);p.closePath();return p})();
  const SHAPES=[maple,maple,maple,oak,oak,birch,beech];
  function size(){const DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;for(const c of [back,front]){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR)}cb.setTransform(DPR,0,0,DPR,0,0);cf.setTransform(DPR,0,0,DPR,0,0)}
  function spawn(kind,isShed){
    const near=isShed||Math.random()<.35;
    const p={kind,near,x:Math.random()*W,y:-30-Math.random()*H,rot:Math.random()*6.28,vr:(Math.random()-.5)*2,flip:Math.random()*6.28,vf:1.5+Math.random()*3,sway:Math.random()*6.28,vs:.6+Math.random()*1.2};
    if(kind==="leaf"){
      const roll=Math.random();
      if(roll<.06){p.acorn=true;p.size=near?7:4;p.vy=near?90:50;p.vr=(Math.random()-.5)*4;p.alpha=near?.95:.6}
      else{p.shape=SHAPES[Math.floor(Math.random()*SHAPES.length)];p.col=LEAFCOL[Math.floor(Math.random()*LEAFCOL.length)];p.size=(near?14+Math.random()*16:6+Math.random()*8)*(p.shape===maple?1:.85);p.vy=near?38+Math.random()*30:18+Math.random()*18;p.alpha=near?.95:.6;
        p.spinner=Math.random()<.07;if(p.spinner){p.shape=null;p.col="#b8893a";p.size=near?12:7;p.vr=8+Math.random()*6;p.vy*=1.25}}
    } else {p.crystal=Math.random()<(near?.18:.06);p.size=near?2+Math.random()*3.6:.7+Math.random()*1.8;if(p.crystal)p.size=near?6+Math.random()*5:3+Math.random()*2.5;p.vy=near?40+Math.random()*35:16+Math.random()*20;p.alpha=near?.75+Math.random()*.25:.35+Math.random()*.4}
    p.vx=0;(isShed?shedParts:parts).push(p);return p;
  }
  function fill(){parts=[];if(RM.matches||!allow("effects","falling"))return;const area=W*H/1e6,n=X()?Math.round(140*Math.min(1.6,area)+40):Math.round(34*Math.min(1.6,area)+12);for(let i=0;i<n;i++){const p=spawn(X()?"snow":"leaf");p.y=Math.random()*H}}
  const memo={};const shade=(h,a)=>memo[h+a]||(memo[h+a]=sh(h,a));
  function drawLeaf(c,p){
    c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=p.alpha;
    if(p.acorn){c.scale(p.size/4,p.size/4);c.fillStyle="#a8743a";c.beginPath();c.ellipse(0,1,2.2,3,0,0,7);c.fill();c.fillStyle="#6b4a24";c.beginPath();c.ellipse(0,-1.4,2.6,1.5,0,0,7);c.fill();c.fillRect(-.3,-4,.6,1.6);c.restore();return}
    const fx=Math.cos(p.flip);c.scale(p.size*Math.max(.12,Math.abs(fx)),p.size);
    if(p.spinner){c.fillStyle=p.col;c.beginPath();c.ellipse(0,0,.18,.18,0,0,7);c.fill();c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(.9,-.25,1.3,.12);c.quadraticCurveTo(.7,.2,0,0);c.fill();c.restore();return}
    c.fillStyle=fx<0?shade(p.col,-.25):p.col;c.fill(p.shape);c.strokeStyle=shade(p.col,-.45);c.lineWidth=.06;c.globalAlpha=p.alpha*.7;c.beginPath();c.moveTo(0,1.15);c.lineTo(0,-.8);
    if(p.shape===maple){c.moveTo(0,.35);c.lineTo(.7,-.2);c.moveTo(0,.35);c.lineTo(-.7,-.2);c.moveTo(0,.45);c.lineTo(.5,.55);c.moveTo(0,.45);c.lineTo(-.5,.55)}else{for(let k=-.5;k<.7;k+=.3){c.moveTo(0,k);c.lineTo(.32,k-.22);c.moveTo(0,k);c.lineTo(-.32,k-.22)}}
    c.stroke();c.restore()}
  function drawSnow(c,p){c.globalAlpha=p.alpha;c.fillStyle="#fff";if(p.crystal){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.strokeStyle="rgba(255,255,255,.9)";c.lineWidth=Math.max(.6,p.size*.09);c.beginPath();for(let k=0;k<6;k++){const a=k*Math.PI/3,ex=Math.cos(a)*p.size,ey=Math.sin(a)*p.size;c.moveTo(0,0);c.lineTo(ex,ey);const mx=ex*.6,my=ey*.6;c.moveTo(mx,my);c.lineTo(mx+Math.cos(a+.6)*p.size*.3,my+Math.sin(a+.6)*p.size*.3);c.moveTo(mx,my);c.lineTo(mx+Math.cos(a-.6)*p.size*.3,my+Math.sin(a-.6)*p.size*.3)}c.stroke();c.restore()}else{c.beginPath();c.arc(p.x,p.y,p.size,0,7);c.fill()}}
  function step(dt){gust+=(Math.random()<.004?(Math.random()*2-1)*60:0);gust*=.985;wind=Math.sin(performance.now()/7000)*12+gust;
    for(const list of [parts,shedParts])for(const p of list){p.sway+=p.vs*dt;p.flip+=p.vf*dt;p.rot+=p.vr*dt*(p.kind==="leaf"?1:.3);const sw=p.acorn?0:Math.sin(p.sway)*(p.kind==="leaf"?(p.near?34:18):(p.near?14:7));p.x+=(sw+wind*(p.near?1:.5)*(p.acorn?.3:1)+(p.vx||0))*dt;p.y+=p.vy*dt*(p.kind==="leaf"&&!p.acorn?(.7+.5*Math.abs(Math.cos(p.flip))):1);if(list===shedParts){p.life+=dt;if(p.floorY&&p.y>p.floorY){p.y=p.floorY;p.vy=0;p.vx*=.8;p.vr*=.5}}}
    for(const p of parts){if(p.y>H+40){p.y=-30-Math.random()*60;p.x=Math.random()*W}if(p.x>W+40)p.x=-30;if(p.x<-40)p.x=W+30}
    shedParts=shedParts.filter(p=>p.life<p.ttl);
    for(const rk of rockets){rk.vy+=230*dt;rk.x+=rk.vx*dt;rk.y+=rk.vy*dt;if(rk.y<=rk.ty||rk.vy>-60){rk.done=true;burst(rk)}}
    rockets=rockets.filter(rk=>!rk.done);
    for(const p of sparks){p.px=p.x;p.py=p.y;p.vx*=.982;p.vy=p.vy*.982+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life+=dt}
    sparks=sparks.filter(p=>p.life<p.ttl)}
  function draw(){cb.clearRect(0,0,W,H);cf.clearRect(0,0,W,H);for(const p of parts){const c=p.near?cf:cb;p.kind==="leaf"?drawLeaf(c,p):drawSnow(c,p)}for(const p of shedParts){const a=p.alpha;p.alpha=a*Math.max(0,1-Math.max(0,p.life-(p.ttl-.6))/.6);p.kind==="leaf"?drawLeaf(cf,p):drawSnow(cf,p);p.alpha=a}
    if(rockets.length||sparks.length){cf.save();cf.globalCompositeOperation="lighter";cf.lineCap="round";

      for(const p of sparks){const k=1-p.life/p.ttl;cf.globalAlpha=Math.max(0,k)*(p.tw&&Math.random()<.4?.3:1);cf.strokeStyle=p.col;cf.lineWidth=2.2*k+.6;cf.beginPath();cf.moveTo(p.px,p.py);cf.lineTo(p.x,p.y);cf.stroke()}
      cf.restore()}
    cb.globalAlpha=1;cf.globalAlpha=1}
  function loop(t){if(!running)return;const dt=Math.min(.05,(t-(last||t))/1000);last=t;step(dt);draw();requestAnimationFrame(loop)}
  addEventListener("resize",()=>{size();fill()});
  document.addEventListener("visibilitychange",()=>{if(document.hidden)running=false;else if(!running){running=true;last=0;requestAnimationFrame(loop)}});
  RM.addEventListener&&RM.addEventListener("change",fill);
  size();fill();requestAnimationFrame(loop);
  return {spawn,fill,fireworks};
})();

{const mt=document.getElementById("spMat");if(SP.mat)mt.textContent=SP.mat;else mt.remove();}
