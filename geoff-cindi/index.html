<script>
(function(){
  var D=JSON.parse(document.getElementById("lockdata").textContent), K="famlock:"+D.name, enc=new TextEncoder();
  var m=document.getElementById("m"), say=document.getElementById("say");
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function tob64(u){var s="";u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  function norm(c){return String(c||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
  function store(v){try{if(v)localStorage.setItem(K,JSON.stringify(v));else localStorage.removeItem(K)}catch(e){}}
  function stored(){try{return JSON.parse(localStorage.getItem(K)||"null")}catch(e){return null}}
  async function keyFrom(code){
    var base=await crypto.subtle.importKey("raw",enc.encode(norm(code)),"PBKDF2",false,["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(D.salt),iterations:D.iter},base,256));
  }
  async function open(raw){
    var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]), c=b64(D.ct);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:c.slice(0,12)},key,c.slice(12));
    return new TextDecoder().decode(pt);
  }
  function show(page,raw,code){
    if(D.hash&&code&&!/[#&]g=/.test(location.hash)){try{history.replaceState(null,"",location.pathname+location.search+"#g="+code)}catch(e){}}
    var inject="<script>window.__FAMKEY="+JSON.stringify(tob64(raw))+";window.__FAMCODE="+JSON.stringify(code)+";<\/script>";
    page=page.replace(/<head(\s[^>]*)?>/i,function(h){return h+inject});
    document.open();document.write(page);document.close();
  }
  function ask(note){
    m.className="";
    m.innerHTML='<h1>'+D.heading+'</h1><p>'+D.prompt+'</p><form id="f" autocomplete="off"><input id="c" name="c" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Family code" placeholder="'+D.placeholder+'"><button type="submit">Open</button></form><p id="msg" role="status"></p>';
    var f=document.getElementById("f"),c=document.getElementById("c"),msg=document.getElementById("msg");
    if(note)msg.textContent=note;
    f.onsubmit=function(e){e.preventDefault();var code=c.value.trim();if(norm(code).length<6){msg.textContent="That code looks too short.";return}
      msg.textContent="Opening…";try_(code).then(function(ok){if(!ok)msg.textContent="That code didn't open it. Check it and try again."})};
  }
  async function try_(code){
    try{var raw=await keyFrom(code),page=await open(raw)}catch(e){return false}
    var c=code.trim().toLowerCase();store({code:c,salt:D.salt,key:tob64(raw)});show(page,raw,c);return true;
  }
  function parsed(){return new Promise(function(r){if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(r,0)});else setTimeout(r,0)})}
  (async function(){
    await parsed(); /* document.open() while this page is still being parsed would add to it instead of replacing it */
    if(!window.crypto||!crypto.subtle){say.textContent="This page needs a newer browser.";return}
    var h=/[#&]g=([A-Za-z0-9-]{6,30})/.exec(location.hash);
    if(h&&await try_(h[1]))return;
    var s=stored();
    if(s&&s.salt===D.salt&&s.key){try{var raw=b64(s.key),page=await open(raw);show(page,raw,s.code);return}catch(e){store(null)}}
    else if(s&&s.code){if(await try_(s.code))return;store(null)}
    /* a code this phone already keeps for the same family (for example the sudoku's), so nobody is asked twice */
    for(var i=0;i<(D.legacy||[]).length;i++){try{var lc=JSON.parse(localStorage.getItem(D.legacy[i])||"null");if(lc&&await try_(String(lc)))return}catch(e){}}
    ask(h?"The code in that link didn't open it.":"");
  })();
})();
</script>
